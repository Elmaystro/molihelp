name: Ad Library scraper

on:
  schedule:
    - cron: "0 6 * * *"        # every day at 06:00 UTC
  workflow_dispatch:            # "Run workflow" button, with custom inputs
    inputs:
      query:
        description: "Keyword to search"
        required: false
      country:
        description: "Country code (ALL, US, FR...)"
        required: false
        default: "ALL"
      status:
        description: "active / inactive / all"
        required: false
        default: "active"

permissions:
  contents: write               # needed to commit metadata.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python fb_ad_scraper.py \
            --query "${{ inputs.query || vars.AD_QUERY || 'running shoes' }}" \
            --country "${{ inputs.country || vars.AD_COUNTRY || 'ALL' }}" \
            --status "${{ inputs.status || 'active' }}" \
            --out ads_out --max-ads 300

      - name: Upload full results (media + screenshot + JSON)
        uses: actions/upload-artifact@v4
        with:
          name: ad-${{ github.run_id }}
          path: ads_out/
          retention-days: 30

      - name: Commit tables + metadata only
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ads_out/all_ads.csv ads_out/all_ads.json ads_out/*/metadata.json
          git diff --cached --quiet || git commit -m "Add ad metadata (run ${{ github.run_id }})"
          git push
